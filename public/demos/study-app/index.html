<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Study app demo</title>
<style>
:root {
  --blue: #003262; --gold: #FDB515; --bg: #f6f7fb; --card: #ffffff; --ink: #14213d;
  --muted: #5b6475; --line: #dde2ec; --ok: #1f7a4d; --warn: #b4441c; --soft: #e9eef8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1424; --card: #16213a; --ink: #eef2fb; --muted: #a9b3c7; --line: #2a3756; --soft: #1d2a47; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; }
header { background: var(--blue); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
header .brand { font-weight: 800; letter-spacing: .3px; cursor: pointer; }
header .brand span { color: var(--gold); }
header .who { margin-left: auto; font-size: 13px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45vw; }
header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5); padding: 4px 10px; border-radius: 8px; font-size: 13px; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
main.wide { max-width: 1280px; }
h1 { font-size: 26px; margin: 8px 0 4px; } h2 { font-size: 20px; margin: 18px 0 8px; } h3 { font-size: 16px; margin: 14px 0 6px; }
p { margin: 6px 0; } .muted { color: var(--muted); } .small { font-size: 13px; }
button, select, input { font: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; min-height: 46px; }
.btn.gold { background: var(--gold); color: #1a1a1a; } .btn.ghost { background: var(--soft); color: var(--ink); }
.btn.ok { background: var(--ok); } .btn.warn { background: var(--warn); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; cursor: pointer; text-align: left; color: var(--ink); }
.tile b { display: block; font-size: 17px; } .tile .muted { font-size: 14px; }
.tile .bar { height: 6px; background: var(--soft); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.tile .bar i { display: block; height: 100%; background: var(--gold); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.flash { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 22px 18px; min-height: 220px; cursor: pointer; user-select: none; }
.flash .front { font-size: 22px; font-weight: 800; }
.flash .hint { color: var(--muted); font-size: 14px; margin-top: 18px; }
.flash.revealed { border-color: var(--gold); cursor: default; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; margin-top: 10px; }
.chip { display: inline-block; font-size: 12px; background: var(--soft); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
dl { margin: 0; } dt { font-weight: 700; margin-top: 10px; } dd { margin: 2px 0 0; }
ul { padding-left: 20px; margin: 6px 0; }
.controls { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 14px 0 10px; }
.controls .btn { flex: 1; }
.center { text-align: center; }
.signin { max-width: 440px; margin: 10vh auto; text-align: center; }
.err { color: var(--warn); font-weight: 600; }
input[type=text] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 18px; }
select { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.ex { border-left: 4px solid var(--line); padding: 4px 10px; margin: 8px 0; }
.ex.strong { border-color: var(--ok); } .ex.weak { border-color: var(--warn); }
/* live room */
.code { font-size: 64px; font-weight: 900; letter-spacing: 10px; color: var(--blue); }
@media (prefers-color-scheme: dark) { .code { color: var(--gold); } }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.team { border-radius: 14px; padding: 12px; color: #fff; text-align: center; }
.team b { font-size: 15px; display: block; } .team .pts { font-size: 36px; font-weight: 900; line-height: 1.1; }
.team .ppl { font-size: 12px; opacity: .9; }
.t0 { background: #2f5fb3; } .t1 { background: #b8860b; } .t2 { background: #2e8b57; } .t3 { background: #b03a48; }
.host-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 900px) { .host-grid { grid-template-columns: 1fr; } .code { font-size: 44px; } }
.projector .flash .front { font-size: 40px; } .projector .flash { min-height: 300px; font-size: 22px; }
.buzz { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: var(--soft); margin: 6px 0; }
.buzz .grow { flex: 1; }
.buzzbtn { width: 100%; min-height: 140px; font-size: 32px; border-radius: 24px; }
.timer { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand" id="brand">Study app <span>demo</span></div>
  <div class="who" id="who"></div>
  <button id="signout" class="hidden">Sign out</button>
</header>
<div style="background:#fff7dd;color:#3a2f00;padding:8px 16px;font-size:14px;text-align:center">Demo with the real midterm review content. Progress stays in this browser and nothing is sent anywhere. <a href="/work/gsi-study-app/" target="_top" style="color:#003262;font-weight:700">Back to the case study</a></div>
<main id="app"><p class="muted center">Loading...</p></main>

<script>
(function () {
  "use strict";
  var SUPABASE_URL = "";
  var SUPABASE_KEY = "";
  var DOMAIN = "@berkeley.edu";
  var TEAMS = ["Blue", "Gold", "Green", "Red"];
  var DECK_ORDER = ["terms", "sources", "nameThat", "agents", "essays"];
  var LIVE_DECKS = ["terms", "nameThat", "sources", "agents"];

  // Demo only: a stand-in for the realtime client. Rooms sync between tabs of
  // this browser with BroadcastChannel; nothing is sent over the network.
  var sb = (function () {
    function Chan(name, cfg) {
      var self = this;
      this.key = (cfg && cfg.config && cfg.config.presence && cfg.config.presence.key) || Math.random().toString(36).slice(2);
      this.hb = {}; this.hp = []; this.state = {}; this.mine = null;
      this.bc = ("BroadcastChannel" in window) ? new BroadcastChannel("studydemo:" + name) : null;
      if (this.bc) this.bc.onmessage = function (e) { self.recv(e.data); };
    }
    Chan.prototype.on = function (type, filt, cb) { if (type === "broadcast") this.hb[filt.event] = cb; else if (type === "presence") this.hp.push(cb); return this; };
    Chan.prototype.sync = function () { this.hp.forEach(function (cb) { cb(); }); };
    Chan.prototype.post = function (m) { if (this.bc) this.bc.postMessage(m); };
    Chan.prototype.recv = function (m) {
      if (m.k === "b") { var cb = this.hb[m.event]; if (cb) cb({ payload: m.payload }); }
      else if (m.k === "p") {
        if (m.payload) this.state[m.key] = [m.payload]; else if (m.key !== this.key) delete this.state[m.key];
        this.sync();
        if (m.ask && this.mine) this.post({ k: "p", key: this.key, payload: this.mine });
      }
    };
    Chan.prototype.subscribe = function (cb) { var s = this; setTimeout(function () { s.post({ k: "p", key: s.key, payload: null, ask: true }); cb("SUBSCRIBED"); }, 0); return this; };
    Chan.prototype.send = function (m) { this.post({ k: "b", event: m.event, payload: m.payload }); return Promise.resolve("ok"); };
    Chan.prototype.track = function (p) { this.mine = p; this.state[this.key] = [p]; this.post({ k: "p", key: this.key, payload: p }); this.sync(); return Promise.resolve("ok"); };
    Chan.prototype.presenceState = function () { return this.state; };
    Chan.prototype.close = function () { if (this.mine) this.post({ k: "p", key: this.key, payload: null }); if (this.bc) this.bc.close(); };
    var open = [];
    window.addEventListener("pagehide", function () { open.forEach(function (c) { try { c.close(); } catch (e) {} }); });
    return {
      channel: function (n, c) { var ch = new Chan(n, c); open.push(ch); return ch; },
      removeChannel: function (ch) { ch.close(); },
      auth: { signOut: function () { return Promise.resolve(); } }
    };
  })();
  var app = document.getElementById("app");
  var C = null;          // content (loaded only after sign-in)
  var USER = null;
  var live = null;       // live room state
  var DEMO = true;

  // ---------- storage (works when blocked) ----------
  var mem = {};
  var store = (function () {
    try { var k = "__studydemo"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return localStorage; }
    catch (e) { return null; }
  })();
  function sget(k, d) {
    try { var v = store ? store.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; }
  }
  function sset(k, v) {
    var s = JSON.stringify(v);
    try { if (store) store.setItem(k, s); else mem[k] = s; } catch (e) { mem[k] = s; }
  }
  var PKEY = "studydemo:progress:v1";
  function prog() { return sget(PKEY, {}); }
  function mastered(deck) { var p = prog(); return (p[deck] && p[deck].m) || []; }
  function setMastered(deck, list) { var p = prog(); p[deck] = { m: list }; sset(PKEY, p); }

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function h(html) { app.innerHTML = html; window.scrollTo(0, 0); }
  function $(s) { return app.querySelector(s); }
  function on(sel, ev, fn) { var el = $(sel); if (el) el.addEventListener(ev, fn); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var MYKEY = "studydemo:mycards:v1";
  function myCards() { return sget(MYKEY, []); }
  function setMyCards(list) { sset(MYKEY, list); }
  function deck(k) {
    if (k === "mine") return { title: "My cards", blurb: "Write your own cards. They stay on this device only.", cards: myCards() };
    return C.decks[k];
  }
  function cardById(k, id) { var cs = deck(k).cards || deck(k).prompts; for (var i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i]; return null; }
  function cardsOf(k) { return deck(k).cards || deck(k).prompts; }
  function setWide(w) { app.className = w ? "wide" : ""; }

  // ---------- usage tracking ----------
  // Browsers can only insert rows (see RLS); the GSI dashboard reads them server-side.
  // Active time counts only while the tab is visible and the student interacted in the last 2 minutes.
  var SCALE = DEMO && /[?&]fast=1/.test(location.search) ? 10 : 1;  // local tests only: 1 tick = 100ms
  var IDLE_TICKS = 120, BEAT_TICKS = 30;
  var T = { sid: null, token: null, ready: null, active: 0, ticks: 0, idle: 0, timer: null, wired: false };
  function uuid() {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
  }
  function deviceType() {
    var ua = navigator.userAgent || "";
    if (/iPad|Tablet/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "tablet";
    if (/Mobi|Android|iPhone/i.test(ua)) return "phone";
    return "desktop";
  }
  function insert(table, row) {
    if (DEMO) { (window.__studydemo_rows = window.__studydemo_rows || []).push({ table: table, row: row, at: Date.now() }); return Promise.resolve(); }
    return sb.from(table).insert(row).then(function (r) { if (r.error) console.warn("tracking:", r.error.message); });
  }
  function beacon(table, row) {
    // keepalive fetch survives the page closing, unlike a normal request
    if (DEMO) { (window.__studydemo_rows = window.__studydemo_rows || []).push({ table: table, row: row, at: Date.now(), beacon: true }); return; }
    if (!T.token) return;
    try {
      fetch(SUPABASE_URL + "/rest/v1/" + table, { method: "POST", keepalive: true,
        headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + T.token, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(row) }).catch(function () {});
    } catch (e) {}
  }
  function track(type, fields) {
    if (!T.sid) return;
    var row = { session_id: T.sid, type: type };
    for (var k in fields) row[k] = fields[k];
    T.ready.then(function () { insert("events", row); });
  }
  function vaEvent(name, data) { try { window.va("event", { name: name, data: data }); } catch (e) {} }
  function flushActive(useBeacon) {
    if (!T.sid || T.active <= 0) return;
    var row = { session_id: T.sid, type: "heartbeat", active_seconds: Math.min(T.active, 120) };
    T.active = 0;
    if (useBeacon) beacon("events", row); else T.ready.then(function () { insert("events", row); });
  }
  function startTracking() {
    if (T.sid) return;
    T.sid = uuid();
    T.ready = insert("sessions", { id: T.sid, device: deviceType() });
    T.idle = 0;
    if (!T.timer) T.timer = setInterval(function () {
      if (!T.sid) return;
      T.ticks++; T.idle++;
      if (document.visibilityState === "visible" && T.idle <= IDLE_TICKS) T.active++;
      if (T.ticks % BEAT_TICKS === 0) flushActive(false);
    }, 1000 / SCALE);
    if (T.wired) return;
    T.wired = true;
    ["pointerdown", "keydown", "scroll", "touchstart", "wheel"].forEach(function (evName) {
      window.addEventListener(evName, function () { T.idle = 0; }, { passive: true, capture: true });
    });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushActive(true); else T.idle = 0; });
    window.addEventListener("pagehide", function () {
      if (!T.sid) return;
      flushActive(true);
      beacon("events", { session_id: T.sid, type: "session_end" });
      T.sid = null;
    });
    window.addEventListener("pageshow", function (e) { if (e.persisted && !T.sid) startTracking(); });
  }
  function stopTracking() {
    if (T.sid) { flushActive(true); beacon("events", { session_id: T.sid, type: "session_end" }); }
    T.sid = null;
  }

  // ---------- auth ----------
  function showSignIn(msg) {
    setWide(false);
    document.getElementById("signout").classList.add("hidden");
    document.getElementById("who").textContent = "";
    h('<div class="signin panel">' +
      '<h1>Study app demo</h1>' +
      '' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<p><button class="btn gold" id="g">Sign in with Berkeley Google</button></p>' +
      '</div>');
    on("#g", "click", function () {
      sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname, queryParams: { hd: "berkeley.edu", prompt: "select_account" } } })
        .then(function (r) { if (r.error) showSignIn("Sign-in is not available yet. Please try again in a few minutes."); });
    });
  }

  function urlError() {
    var q = new URLSearchParams(location.search + "&" + location.hash.replace(/^#/, ""));
    var e = q.get("error_description") || q.get("error");
    if (e) { history.replaceState(null, "", location.pathname); return "Only @berkeley.edu accounts can sign in. Please use your Berkeley Google account."; }
    return null;
  }

  function boot() {
    var uerr = urlError();
    sb.auth.getSession().then(function (r) {
      var s = r.data && r.data.session;
      if (!s) return showSignIn(uerr);
      var email = (s.user.email || "").toLowerCase();
      if (email.slice(-DOMAIN.length) !== DOMAIN) {
        return sb.auth.signOut().then(function () { showSignIn("Only @berkeley.edu accounts can sign in. Please use your Berkeley Google account."); });
      }
      USER = { email: email, id: s.user.id };
      T.token = s.access_token;
      sb.auth.onAuthStateChange(function (_e, sess) { T.token = sess ? sess.access_token : null; });
      sb.from("content").select("data").eq("id", 1).maybeSingle().then(function (res) {
        if (res.error || !res.data) return showSignIn("Could not load the review content. Try signing out and back in.");
        start(res.data.data, USER);
      });
    });
  }

  function start(content, user) {
    C = content; USER = user;
    document.getElementById("who").textContent = user.email;
    var so = document.getElementById("signout");
    so.onclick = function () { leaveLive(); stopTracking(); sb.auth.signOut().then(function () { C = null; showSignIn(); }); };
    document.getElementById("brand").onclick = function () { leaveLive(); home(); };
    startTracking();
    home();
  }

  // ---------- home ----------
  function home() {
    setWide(false);
    var tiles = DECK_ORDER.map(function (k, i) {
      var d = deck(k), n = cardsOf(k).length, m = mastered(k).length;
      return '<button class="tile" data-deck="' + k + '"><span class="chip">Deck ' + (i + 1) + '</span><b>' + esc(d.title) + '</b>' +
        '<span class="muted">' + esc(d.blurb) + '</span><div class="small muted" style="margin-top:6px">' + m + '/' + n + ' mastered</div>' +
        '<div class="bar"><i style="width:' + Math.round(100 * m / n) + '%"></i></div></button>';
    }).join("");
    var mc = myCards().length, mm = mastered("mine").length;
    tiles += '<button class="tile" id="mine"><span class="chip">Your own</span><b>My cards</b><span class="muted">Write your own cards to study. Only you can see them.</span>' +
      '<div class="small muted" style="margin-top:6px">' + (mc ? mm + '/' + mc + ' mastered' : 'No cards yet') + '</div>' +
      '<div class="bar"><i style="width:' + (mc ? Math.round(100 * mm / mc) : 0) + '%"></i></div></button>';
    h('<h1>' + esc(C.meta.title) + '</h1><p class="muted">' + esc(C.meta.course) + ' &middot; Midterm ' + esc(C.meta.exam) + '</p>' +
      '<div class="grid" style="margin-top:14px"><button class="tile" id="intro"><span class="chip">Start here</span><b>How the exam works</b><span class="muted">Format, contextualize vs. analyze, and the 5 W\'s.</span></button>' + tiles + '</div>' +
      '<h2>Play together</h2><div class="row"><button class="btn gold grow" id="join">Join a game</button><button class="btn ghost grow" id="host">Host (projector)</button></div>' +
      '<p class="small muted" style="margin-top:18px">Demo: progress is saved in this browser only. To try the game, open this page in a second tab: host in one, join in the other.</p>');
    on("#intro", "click", intro);
    on("#join", "click", joinScreen);
    on("#host", "click", hostSetup);
    on("#mine", "click", function () { myCardsScreen(); });
    app.querySelectorAll("[data-deck]").forEach(function (b) { b.addEventListener("click", function () { study(b.getAttribute("data-deck")); }); });
  }

  function intro() {
    var I = C.intro, cv = I.contextVsAnalyze;
    h('<p><button class="btn ghost" id="back">&larr; Home</button></p><h1>How the exam works</h1>' +
      '<div class="panel"><h2>Format</h2><ul>' + I.format.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join("") + '</ul></div>' +
      '<div class="panel"><h2>Contextualize vs. analyze</h2><p><b>' + esc(cv.contextualize) + '</b></p><p><b>' + esc(cv.analyze) + '</b></p>' +
      cv.examples.map(function (e) { var cls = /weak/i.test(e.label) ? "weak" : "strong"; return '<div class="ex ' + cls + '"><div class="label">' + esc(e.label) + '</div>' + esc(e.text) + '</div>'; }).join("") + '</div>' +
      '<div class="panel"><h2>The 5 W\'s</h2><dl>' + I.fiveWs.map(function (w) { return '<dt>' + esc(w[0]) + '</dt><dd>' + esc(w[1]) + '</dd>'; }).join("") + '</dl></div>' +
      '<div class="panel"><h2>How to study here</h2><p>' + esc(I.howToStudy) + '</p></div>');
    on("#back", "click", home);
  }

  // ---------- card renderers ----------
  function front(k, c) {
    if (k === "mine") return '<div class="front" style="white-space:pre-wrap">' + esc(c.front) + '</div>';
    if (k === "terms") return '<div class="front">' + esc(c.term) + '</div>';
    if (k === "sources") return '<div class="front">' + esc(c.name) + '</div><p class="muted">Give the 5 W\'s, the context, and the significance.</p>';
    if (k === "nameThat") return '<div class="label">' + esc(c.kind) + '</div><div class="front" style="font-weight:600">' + esc(c.text) + '</div>';
    if (k === "agents") return '<div class="front">' + esc(c.agent) + '</div><p class="muted">' + esc(c.realm) + '. Define it and give examples from different weeks.</p>';
    if (k === "essays") return '<div class="label">Practice prompt</div><div class="front" style="font-size:19px;font-weight:600">' + esc(c.q) + '</div><p class="muted">Outline a thesis and three body paragraphs before revealing.</p>';
    return "";
  }
  function back(k, c) {
    if (k === "mine") return '<p style="white-space:pre-wrap">' + esc(c.back) + '</p>';
    if (k === "terms") return '<div class="label">Definition</div><p>' + esc(c.def) + '</p><div class="label">Why it matters</div><p>' + esc(c.sig) + '</p>';
    if (k === "sources") {
      var P = deck("sources").panels;
      return '<dl>' + P.map(function (p) { return '<dt>' + esc(p) + '</dt><dd>' + esc(c[p.toLowerCase()]) + '</dd>'; }).join("") +
        '<dt>Use it in an essay</dt><dd>' + esc(c.use) + '</dd></dl>';
    }
    if (k === "nameThat") return '<div class="label">Source</div><p><b>' + esc(c.answer) + '</b></p><div class="label">How you could tell</div><p>' + esc(c.clue) + '</p>';

  // ---------- live room ----------
  function makeCode() { var a = "ABCDEFGHJKLMNPQRSTUVWXYZ", s = ""; for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
  var CID = Math.random().toString(36).slice(2, 10);
  function myId() { return CID; }
  function leaveLive() {
    if (live && live.ch) { try { sb.removeChannel(live.ch); } catch (e) {} }
    if (live && live.tick) clearInterval(live.tick);
    live = null;
  }
  function openChannel(code, presence) {
    var ch = sb.channel("studydemo-room-" + code, { config: { broadcast: { self: false }, presence: { key: myId() } } });
    ch.on("presence", { event: "sync" }, function () { if (live) { live.people = ch.presenceState(); live.onPresence && live.onPresence(); } });
    return { ch: ch, track: function () { return ch.track(presence); } };
  }

  function hostSetup() {
    setWide(false);
    h('<p><button class="btn ghost" id="back">&larr; Home</button></p><h1>Host a game</h1>' +
      '<div class="panel"><div class="label">Deck</div><select id="hd">' + LIVE_DECKS.map(function (k) { return '<option value="' + k + '">' + esc(deck(k).title) + '</option>'; }).join("") + '</select>' +
      '<div class="label">Week</div><select id="hw"><option value="all">All weeks</option>' + Object.keys(C.meta.weeks).map(function (w) { return '<option value="' + w + '">' + esc(C.meta.weeks[w]) + '</option>'; }).join("") + '</select>' +
      '<div class="label">Teams</div><select id="ht"><option>2</option><option>3</option><option selected>4</option></select>' +
      '<p style="margin-top:14px"><button class="btn gold" id="go">Open room</button></p></div>');
    on("#back", "click", home);
    on("#go", "click", function () { hostStart($("#hd").value, $("#hw").value, parseInt($("#ht").value, 10)); });
  }

  function hostStart(k, week, nTeams) {
    leaveLive();
    var ids = shuffle(cardsOf(k).filter(function (c) { return week === "all" || !c.week || String(c.week) === week; }).map(function (c) { return c.id; }));
    var code = makeCode();
    var scores = {}; TEAMS.slice(0, nTeams).forEach(function (t) { scores[t] = 0; });
    live = { role: "host", code: code, people: {}, st: { deck: k, ids: ids, idx: 0, revealed: false, scores: scores, buzzes: [], timerEnd: 0, teams: TEAMS.slice(0, nTeams) } };
    var o = openChannel(code, { role: "host" });
    live.ch = o.ch;
    function send() { live.ch.send({ type: "broadcast", event: "state", payload: live.st }); renderHost(); }
    live.send = send;
    o.ch.on("broadcast", { event: "hello" }, function () { send(); })
      .on("broadcast", { event: "buzz" }, function (m) {
        var p = m.payload, st = live.st;
        if (p.idx !== st.idx || st.revealed) return;
        if (st.buzzes.some(function (b) { return b.pid === p.pid; })) return;
        st.buzzes.push({ pid: p.pid, name: String(p.name || "").slice(0, 24), team: p.team });
        send();
      })
      .subscribe(function (status) { if (status === "SUBSCRIBED") { o.track(); send(); } });
    live.onPresence = renderHost;
    live.tick = setInterval(function () { var t = $("#timer"); if (t) t.textContent = timerText(live.st.timerEnd); }, 250);
    renderHost();
  }
  function timerText(end) { if (!end) return "--"; var s = Math.max(0, Math.ceil((end - Date.now()) / 1000)); return s + "s"; }
  function teamPeople() {
    var out = {}; var ps = (live && live.people) || {};
    Object.keys(ps).forEach(function (key) { (ps[key] || []).forEach(function (p) { if (p.role === "player") out[p.team] = (out[p.team] || 0) + 1; }); });
    return out;
  }

      }).join("") : '<p class="muted small">No buzzes yet.</p>') + '</div></div></div>');

  function playerConnect(code, name) {
    live = { role: "player", code: code, name: name, team: null, st: null, people: {}, buzzedIdx: -1 };
    var ch = sb.channel("studydemo-room-" + code, { config: { broadcast: { self: false }, presence: { key: myId() } } });
    live.ch = ch;
    ch.on("broadcast", { event: "state" }, function (m) {
      var prev = live.st; live.st = m.payload;
      if (prev && prev.idx !== live.st.idx) live.buzzedIdx = -1;
      renderPlayer();
    }).subscribe(function (status) {
      if (status === "SUBSCRIBED") { ch.send({ type: "broadcast", event: "hello", payload: {} }); }

    live.tick = setInterval(function () { var t = $("#timer"); if (t && live && live.st) t.textContent = timerText(live.st.timerEnd); }, 250);
    renderPlayer();

  }

  var SAMPLE = {"meta": {"course": "Survey of World History", "title": "Midterm review", "exam": "review", "weeks": {"1": "Week 1: Beginnings, cities, and states", "2": "Week 2: Classical empires and religions", "3": "Week 3: Afro-Eurasia connected", "4": "Week 4: 1492 and the Americas", "5": "Week 5: Silver, sugar, and the Atlantic world", "6": "Week 6: Enlightenment and Atlantic Revolutions", "7": "Week 7: The Haitian Revolution"}}, "intro": {"format": ["Part 1, Definitions (20 points, about 15 minutes): you will see six terms and choose four. For each one, define it and add one sentence on why it matters in world history as we have studied it.", "Part 2, Essay (80 points, about 60 minutes): you choose one of the prompts. Strong essays have a clear thesis, an argument that runs the whole way through, and detailed examples from lecture, readings, and section.", "For the essay, plan on three specific examples from different parts of the world and at least one primary source discussed in detail."], "contextVsAnalyze": {"contextualize": "Contextualize = place the term in its time, place, and situation. Answer the 5 W's so a reader knows exactly what you mean.", "analyze": "Analyze = explain why it matters. What did it change, what did it connect, and what does it show about world history?", "examples": [{"label": "Contextualize, weak", "text": "The Silk Roads were old trade routes."}, {"label": "Contextualize, strong", "text": "The Silk Roads were overland and sea routes linking Han China with Central Asia, Persia, India, and the Roman Mediterranean from about the 2nd century BCE, carrying silk, horses, glass, and spices through many middlemen."}, {"label": "Analyze, weak", "text": "The Silk Roads were important for trade."}, {"label": "Analyze, strong", "text": "The Silk Roads made Afro-Eurasia one connected zone: goods moved, but so did Buddhism, technologies, and disease, which shows that early globalization reshaped beliefs and bodies, not only markets."}]}, "fiveWs": [["Who", "Which people, groups, or agents were involved?"], ["What", "What is it: an event, place, idea, institution, object, or text?"], ["When", "Roughly when? A century or a date range is enough."], ["Where", "Which region, city, or route?"], ["Why", "Why does it matter? This is your significance sentence."]], "howToStudy": "Say your answer out loud (or to a partner) before you tap reveal. Mark Got it or Review again. Missed cards come back later in the deck."}, "decks": {"terms": {"title": "Key Terms", "blurb": "Define it, then give one sentence of significance.", "cards": [{"id": "t01", "week": 1, "term": "Historical agency", "def": "The capacity of people, groups, or forces to cause change and shape historical events. This course organizes agency around five agents: Nature, the Worker, the Merchant, the Soldier, and the Sage.", "sig": "Asking who had agency keeps history from being a list of events and makes you explain why things changed."}, {"id": "t02", "week": 1, "term": "Globalization", "def": "The growing connection of distant societies through trade, migration, conquest, disease, and the movement of ideas.", "sig": "The course treats globalization as very old, not just modern, so each unit asks how connected the world was and who drove the connection."}, {"id": "t03", "week": 1, "term": "Hammurabi's Code", "def": "A Babylonian law code from about 1750 BCE, carved on a stone stele, setting punishments that varied by social rank.", "sig": "One of the earliest written law codes; it shows a state using writing to claim justice and order over a diverse population."}, {"id": "t04", "week": 1, "term": "Mesopotamia", "def": "The land between the Tigris and Euphrates rivers (modern Iraq), home to Sumerian city-states such as Ur and Uruk from about 3500 BCE.", "sig": "Often called a cradle of civilization: irrigation, cities, writing, and states all appear here early."}, {"id": "t05", "week": 1, "term": "Melos", "def": "A small island in the Aegean that tried to stay neutral in the Peloponnesian War. Athens besieged it in 416 BCE, then killed the men and enslaved the women and children.", "sig": "Thucydides made Melos the setting of the Melian Dialogue, the classic debate over whether power or justice decides how states act."}, {"id": "t06", "week": 1, "term": "Cuneiform", "def": "Wedge-shaped writing pressed into clay tablets with a reed stylus, developed in Sumer around 3200 BCE, first for accounting.", "sig": "Writing began as a tool of temples and states to count grain, labor, and taxes, linking literacy to power."}, {"id": "t07", "week": 1, "term": "City, citizen, and state", "def": "The course theme about how cities organized people, who counted as a citizen with rights and duties, and how states claimed authority.", "sig": "Comparing these three across societies (Sumer, Athens, Rome, China) shows different answers to who belongs and who rules."}, {"id": "t08", "week": 1, "term": "Polis", "def": "The Greek city-state, a self-governing community of citizens with its own laws, gods, and army, such as Athens or Sparta.", "sig": "The polis made citizenship central to politics, but citizenship was limited to free men, excluding women, enslaved people, and foreigners."}, {"id": "t09", "week": 1, "term": "Melian Dialogue", "def": "A passage in Thucydides' History of the Peloponnesian War (written c. 400 BCE) staging a debate between Athenian envoys and the leaders of Melos before Athens conquered the island.", "sig": "It is the founding text of political realism: the Athenians argue that the strong do as they can, while the Melians appeal to justice and hope."}, {"id": "t10", "week": 1, "term": "Thucydides", "def": "Athenian general and historian (c. 460 to 400 BCE) who wrote the History of the Peloponnesian War between Athens and Sparta.", "sig": "He tried to explain events by human motives like fear, honor, and interest rather than the will of the gods."}, {"id": "t11", "week": 1, "term": "Delian League", "def": "An alliance of Greek city-states formed in 478 BCE under Athenian leadership against Persia, which Athens turned into its own empire.", "sig": "Shows how a voluntary alliance can become an empire; Athens' demand that Melos join is part of this story."}, {"id": "t12", "week": 1, "term": "Crucial event (Hobsbawm)", "def": "Hobsbawm's idea of a public event that becomes woven into people's lives, shaping both their private lives and how they see the world, and often shared across a whole generation. His own example: as a 15-year-old in Berlin in January 1933, he saw the headline that Hitler had become Chancellor.", "sig": "Asking what counts as a crucial event is a tool for any essay: you must argue why your example changed things, not just that it happened."}, {"id": "t13", "week": 2, "term": "Pax Sinica", "def": "Periods of relative peace and stability in East Asia under strong Chinese dynasties, especially the Han (206 BCE to 220 CE), when China dominated trade and diplomacy in its region.", "sig": "Like Pax Romana, it shows how a large empire can create safe conditions for trade and the spread of ideas, on its own terms."}, {"id": "t14", "week": 2, "term": "Han dynasty", "def": "Chinese dynasty (206 BCE to 220 CE) that made Confucianism the basis of state education and expanded west into Central Asia.", "sig": "Han China set the model of a bureaucratic empire and was the eastern anchor of the Silk Roads."}, {"id": "t15", "week": 2, "term": "Medina", "def": "Arabian city, earlier called Yathrib, where Muhammad and his followers moved from Mecca in 622 CE (the Hijra) and built the first Muslim community.", "sig": "Medina joined religious and political leadership in one community, the starting point of the Islamic calendar and of the first Islamic state."}, {"id": "t16", "week": 2, "term": "Pax Romana", "def": "About two centuries of relative peace across the Roman Empire, from Augustus (27 BCE) to about 180 CE.", "sig": "Roads, law, and a common currency let goods, people, and later Christianity move across the Mediterranean."}, {"id": "t17", "week": 2, "term": "Silk Roads", "def": "Networks of overland and sea routes connecting China, Central Asia, India, Persia, and the Mediterranean from about the 2nd century BCE.", "sig": "They carried goods, but also religions, technologies, and disease, making Afro-Eurasia an early connected world."}, {"id": "t18", "week": 2, "term": "Monotheism and empire", "def": "The course theme about how belief in one God became tied to imperial power, as when Rome adopted Christianity or early caliphs ruled in the name of Islam.", "sig": "An empire with one official faith could unite diverse subjects, but also defined outsiders and justified conquest."}, {"id": "t19", "week": 2, "term": "Edict of Milan (Constantine)", "def": "A 313 CE agreement under Emperor Constantine that granted toleration to Christians in the Roman Empire.", "sig": "It began Christianity's change from a persecuted sect into the religion of the empire, which became official under Theodosius later in the century."}, {"id": "t20", "week": 2, "term": "Confucianism", "def": "Teachings of Confucius (551 to 479 BCE) stressing proper relationships, filial piety, ritual, and rule by virtuous, educated officials.", "sig": "Adopted by the Han state, it shaped Chinese government and family life for two thousand years."}, {"id": "t21", "week": 2, "term": "Terracotta Army", "def": "Thousands of life-size clay soldiers, horses, and chariots buried near the tomb of Qin Shi Huang, the first emperor of a unified China (died 210 BCE), near modern Xi'an.", "sig": "Shows the power of the first Chinese empire to organize huge amounts of labor and to project military might even after death."}, {"id": "t22", "week": 2, "term": "Universalizing religions", "def": "Religions that seek converts from all peoples rather than belonging to one ethnic group or place, such as Buddhism, Christianity, and Islam.", "sig": "They spread along trade routes and with empires, creating communities of believers that crossed political borders."}, {"id": "t23", "week": 2, "term": "Ashoka", "def": "Mauryan emperor of India (ruled c. 268 to 232 BCE) who, after the bloody conquest of Kalinga, promoted Buddhism and moral rule through edicts carved on rocks and pillars.", "sig": "A ruler using religion and public inscriptions to govern a diverse empire, and a major force in spreading Buddhism beyond India."}, {"id": "t24", "week": 3, "term": "Crusades", "def": "Religious wars from 1095 to the late 1200s in which Latin Christians sent armies to take Jerusalem and the Holy Land from Muslim rulers.", "sig": "They hardened Christian and Muslim identities but also increased trade and contact between Europe and the eastern Mediterranean."}, {"id": "t25", "week": 3, "term": "Hagia Sophia", "def": "Great domed church built in Constantinople under Emperor Justinian in 532 to 537 CE; after the Ottoman conquest of 1453 it became a mosque, with minarets added.", "sig": "Its change from cathedral to mosque shows one city passing between empires and faiths while keeping its imperial symbol."}, {"id": "t26", "week": 3, "term": "Mongols", "def": "Steppe peoples united by Chinggis (Genghis) Khan in 1206, who built the largest land empire in history, stretching from Korea to Eastern Europe.", "sig": "Their conquests were violent, but the empire also linked Eurasia more tightly than ever before."}, {"id": "t27", "week": 3, "term": "Genghis Khan", "def": "Temujin (c. 1162 to 1227), proclaimed Chinggis Khan in 1206, who united the Mongol tribes and began their conquests.", "sig": "He built an empire based on loyalty and merit rather than clan, and his successors connected East and West."}, {"id": "t28", "week": 3, "term": "Pax Mongolica", "def": "The period of relative peace and security across Mongol-ruled Eurasia in the 13th and 14th centuries, when trade and travel along the Silk Roads became safer.", "sig": "Goods, ideas, technologies, and people (Marco Polo, envoys, missionaries) crossed Eurasia, and so, many historians argue, did the plague."}, {"id": "t29", "week": 3, "term": "Black Death", "def": "Pandemic of bubonic plague that spread across Eurasia and North Africa in the 1340s, killing perhaps a third or more of Europe's population.", "sig": "An example of Nature as a historical agent; it moved along the same routes as trade and reshaped labor and religion."}, {"id": "t30", "week": 3, "term": "Afro-Eurasia", "def": "Africa, Europe, and Asia seen as one connected landmass and world zone, linked by land routes, the Indian Ocean, and the Mediterranean.", "sig": "Thinking in terms of Afro-Eurasia avoids treating Europe as the center and shows how connected this world was before 1492."}, {"id": "t31", "week": 3, "term": "Ibn Battuta", "def": "Moroccan Muslim scholar and traveler (1304 to c. 1369) who journeyed through North and West Africa, the Middle East, India, and China, then wrote an account of his travels.", "sig": "His travels show a connected Islamic world where a scholar could find work, law, and community across thousands of miles."}, {"id": "t32", "week": 3, "term": "Great Mosque of Djenné", "def": "A huge mud-brick (adobe) mosque in Djenné, in the Mali region of West Africa, with wooden beams sticking out of its walls; the first mosque on the site dates to about the 13th century and the current building to 1907.", "sig": "Shows Islam taking a West African form and Djenné's role as a trade and learning center linked to the trans-Saharan routes."}, {"id": "t33", "week": 3, "term": "Mansa Musa", "def": "Ruler of the Mali Empire (ruled c. 1312 to 1337) whose pilgrimage to Mecca in 1324 displayed so much gold that it was remembered in Cairo for years.", "sig": "Put West Africa and its gold on European and Middle Eastern maps and shows Mali's place in the Islamic world."}, {"id": "t34", "week": 3, "term": "Ottomans", "def": "A Turkish Muslim dynasty that rose in Anatolia around 1300 and built an empire across southeastern Europe, the Middle East, and North Africa.", "sig": "Their control of the eastern Mediterranean and conquest of Constantinople shaped trade routes and pushed Europeans to look for sea routes."}, {"id": "t35", "week": 3, "term": "Fall of Constantinople (1453)", "def": "Ottoman conquest of the Byzantine capital by Sultan Mehmed II using massive cannons, ending the Eastern Roman Empire.", "sig": "Constantinople became Istanbul, the Ottoman capital, a symbol of a power shift in the Mediterranean."}, {"id": "t36", "week": 4, "term": "1492 and \"the Americas\"", "def": "Columbus's voyage of 1492 and the European naming and claiming of the lands across the Atlantic, already home to millions of people and great states.", "sig": "1492 starts sustained contact between the hemispheres; the name \"the Americas\" itself is a European label placed on Indigenous worlds."}, {"id": "t37", "week": 4, "term": "Triple Alliance", "def": "The alliance formed in 1428 of three Nahua city-states, Tenochtitlan (Mexica), Texcoco, and Tlacopan, that built what we call the Aztec Empire.", "sig": "A tribute empire that ruled many peoples in central Mexico; resentment among subject and enemy peoples helped the Spanish conquest."}, {"id": "t38", "week": 4, "term": "Tenochtitlan", "def": "The Mexica capital, founded about 1325 on an island in Lake Texcoco, linked to the shore by causeways and possibly home to 200,000 or more people by 1519.", "sig": "One of the largest cities in the world when the Spanish arrived, which upsets the idea that Europeans met a simple or empty land."}, {"id": "t39", "week": 4, "term": "Templo Mayor", "def": "The great twin-temple pyramid at the center of Tenochtitlan, dedicated to Huitzilopochtli (war and sun) and Tlaloc (rain), rebuilt in several layers.", "sig": "The religious and political heart of the Mexica state; the Spanish built over it, and its ruins were excavated in Mexico City from 1978."}, {"id": "t40", "week": 4, "term": "Quipu", "def": "An Andean device of knotted and colored cords used by the Inca state to record numbers such as census counts, tribute, and labor owed.", "sig": "Shows a vast empire administered without alphabetic writing; Spanish officials relied on quipu keepers even after conquest."}, {"id": "t41", "week": 4, "term": "Columbian Exchange", "def": "Historian Alfred Crosby's term for the transfer of plants, animals, people, and diseases between the Eastern and Western Hemispheres after 1492.", "sig": "Smallpox devastated Indigenous populations, while maize and potatoes changed diets worldwide: Nature as a major agent of change."}, {"id": "t42", "week": 4, "term": "Tlaxcala", "def": "A Nahua state east of Tenochtitlan that was never conquered by the Triple Alliance and allied with Cortés in 1519 to 1521.", "sig": "Shows that the conquest of Mexico depended on Indigenous allies; Tlaxcalans later won special privileges from the Spanish crown."}, {"id": "t43", "week": 4, "term": "Treaty of Tordesillas", "def": "A 1494 agreement between Spain and Portugal, backed by the pope, dividing newly found lands along a line west of the Cape Verde Islands.", "sig": "Two European crowns claimed to divide the world without asking anyone who lived there; it explains why Brazil speaks Portuguese."}, {"id": "t44", "week": 4, "term": "Malinche", "def": "Malintzin (also Doña Marina), a Nahua woman given to Cortés in 1519 who served as his translator and adviser.", "sig": "Her role shows how much conquest depended on Indigenous knowledge and language; she is remembered as both traitor and survivor."}, {"id": "t45", "week": 5, "term": "Silver", "def": "The metal mined in huge quantities in Spanish America (Potosí, Zacatecas) from the 1540s and shipped to Europe and, via Manila, to China.", "sig": "Silver tied the Americas, Europe, and Asia into one global economy; China's demand for silver drove the trade."}, {"id": "t46", "week": 5, "term": "Encomienda", "def": "A Spanish grant giving a colonist (encomendero) the labor and tribute of a group of Indigenous people, in return for protecting them and teaching them Christianity.", "sig": "It joined conversion to forced labor; its abuses fueled Las Casas's protests and royal reforms such as the New Laws of 1542."}, {"id": "t47", "week": 5, "term": "Potosí", "def": "A silver mountain (Cerro Rico) and mining city in the Andes, in modern Bolivia, discovered by the Spanish in 1545 and by 1600 one of the largest cities in the Americas.", "sig": "Potosí's silver financed the Spanish Empire and flowed into world trade, built on forced Indigenous and enslaved African labor."}, {"id": "t48", "week": 5, "term": "Mita", "def": "An Inca system of rotating labor service that Spanish Viceroy Francisco de Toledo reorganized in the 1570s to force Indigenous men to work in the silver mines of Potosí and other sites.", "sig": "It fed the global silver economy at enormous human cost and shows the Spanish adapting an Indigenous institution for colonial extraction."}, {"id": "t49", "week": 5, "term": "Conversion", "def": "The course theme about changing religion, from voluntary acceptance to forced baptism, especially Spanish efforts to Christianize Indigenous Americans.", "sig": "Conversion was used to justify conquest, yet Indigenous peoples often blended Christianity with their own beliefs."}, {"id": "t50", "week": 5, "term": "Valladolid debate", "def": "A formal debate in Spain in 1550 to 1551 between Juan Ginés de Sepúlveda and Bartolomé de las Casas over whether war against Indigenous Americans was just.", "sig": "One of the first major European debates about the rights of colonized peoples; no clear winner was declared."}, {"id": "t51", "week": 5, "term": "Sugar and slavery", "def": "The plantation system in Brazil and the Caribbean that grew sugar for European markets using enslaved Africans.", "sig": "Sugar drove the transatlantic slave trade and made the Caribbean central to the Atlantic economy."}, {"id": "t52", "week": 5, "term": "Middle Passage", "def": "The forced voyage of enslaved Africans across the Atlantic to the Americas, the middle leg of the triangular trade.", "sig": "About 12.5 million people were embarked between the 1500s and 1860s, and about 10.7 million survived to arrive; it built the Atlantic economy on human suffering."}, {"id": "t53", "week": 5, "term": "Atlantic world", "def": "The connected region of Europe, Africa, and the Americas linked by the Atlantic Ocean through trade, migration, slavery, and ideas from the 1500s on.", "sig": "Studying the Atlantic as one system shows how changes in one region affected the others."}, {"id": "t54", "week": 5, "term": "Manila galleons", "def": "Spanish ships that sailed once or twice a year between Acapulco and Manila from 1565 to 1815, carrying American silver to Asia and Chinese silks and porcelain back.", "sig": "They closed the circle of the first truly global trade network, linking the Americas directly to China."}, {"id": "t55", "week": 6, "term": "Christendom", "def": "The idea of a single community of Christian peoples and kingdoms, especially Latin Christian Europe under the pope.", "sig": "Christendom defined who belonged and who was outside, and it began to break apart with the Reformation and Enlightenment."}, {"id": "t56", "week": 6, "term": "Radical Enlightenment", "def": "A strand of Enlightenment thought, named by historian Jonathan Israel and rooted in Spinoza, that rejected divine revelation and inherited hierarchy and argued for democracy, equality, and freedom of thought.", "sig": "It pushed Enlightenment ideas further than moderate thinkers, linking reason to equality and to the revolutions that followed."}, {"id": "t57", "week": 6, "term": "Counterfactual question", "def": "A \"what if\" question that imagines a different outcome, such as what if the Mexica had defeated Cortés.", "sig": "Counterfactuals test causes: if you change one factor and the outcome changes, that factor was important. Enrigue's novel plays with this."}, {"id": "t58", "week": 6, "term": "Enlightenment", "def": "The 17th and 18th century European intellectual movement that valued reason, science, and individual rights and questioned tradition and religious authority.", "sig": "Its ideas about rights and government fed the Atlantic Revolutions, though many thinkers excluded women and colonized peoples."}, {"id": "t59", "week": 6, "term": "\"Sapere aude\" (Kant)", "def": "Latin for \"dare to know,\" the motto Kant gave the Enlightenment in his 1784 essay.", "sig": "It frames Enlightenment as courage to think for yourself rather than following authority."}, {"id": "t60", "week": 6, "term": "Túpac Amaru II rebellion", "def": "A major Indigenous uprising in the Andes in 1780 to 1781, led by José Gabriel Condorcanqui, who took the name of the last Inca ruler.", "sig": "Shows that resistance to colonial rule, labor drafts, and taxes was happening in the Americas before the Haitian Revolution."}, {"id": "t61", "week": 6, "term": "Atlantic Revolutions", "def": "The wave of revolutions around the Atlantic from the 1770s to the 1820s, including the American, French, Haitian, and Spanish American revolutions.", "sig": "Ideas of liberty and equality moved around the Atlantic, but each revolution decided differently who would be free."}, {"id": "t62", "week": 7, "term": "Saint-Domingue", "def": "The French colony on the western part of Hispaniola, the richest colony in the Caribbean in the 18th century because of its sugar and coffee plantations worked by about half a million enslaved people.", "sig": "Its wealth and brutal slavery set the stage for the Haitian Revolution."}, {"id": "t63", "week": 7, "term": "Haitian Revolution", "def": "The 1791 to 1804 uprising in Saint-Domingue in which enslaved people overthrew slavery and French rule and founded Haiti.", "sig": "The only successful large-scale slave revolt in history; it created the first Black republic and pushed the meaning of liberty further than other revolutions."}, {"id": "t64", "week": 7, "term": "Toussaint Louverture", "def": "A formerly enslaved man who became the main military and political leader of the Haitian Revolution in the 1790s; captured by the French, he died in prison in France in 1803.", "sig": "His leadership turned a revolt into a revolutionary state and made him a symbol of Black freedom across the Atlantic."}, {"id": "t65", "week": 7, "term": "Jean-Jacques Dessalines", "def": "Revolutionary general who defeated Napoleon's army and declared Haiti's independence on January 1, 1804, then ruled as emperor until 1806.", "sig": "His declaration made Haiti the second independent nation in the Americas and the first founded by formerly enslaved people."}]}, "sources": {"title": "Primary Sources", "blurb": "Seven panels for each reading, then how to use it in an essay.", "panels": ["Who", "What", "When", "Where", "Why", "Context", "Significance"], "cards": [{"id": "s1", "week": 1, "name": "Hobsbawm, The Age of Extremes (pp. 2-5)", "who": "Eric Hobsbawm, a British Marxist historian, writing late in his career about the century he lived through.", "what": "The opening of a history of the \"short twentieth century,\" where he explains how the century's crucial events shaped his own life and his generation's, and warns that historical memory is being lost.", "when": "Published 1994, just after the Cold War ended.", "where": "Britain; the book covers the whole world.", "why": "To show how public events shape private lives, and to argue that historians must remember what others forget and try to understand rather than judge.", "context": "The Soviet Union had collapsed in 1991, so Hobsbawm saw the period from 1914 to 1991 as a finished era.", "significance": "Gives us the idea of crucial events, and the warning that young people grow up in a \"permanent present\" cut off from the past.", "use": "Use it to frame any essay about turning points: why is your example a crucial event, and who decides?"}, {"id": "s2", "week": 1, "name": "Genesis 11:1-9 (Tower of Babel)", "who": "Hebrew scribes; the text became scripture for Jews, Christians, and Muslims.", "what": "The story of a united humanity with one language that builds a city and a tower to reach heaven; God confuses their language and scatters them.", "when": "Written down in the first millennium BCE, drawing on older traditions.", "where": "Set in Shinar, in Mesopotamia; Babel is linked to Babylon.", "why": "To explain why humans speak many languages and live apart, and to warn against human pride.", "context": "Mesopotamian cities built huge stepped temple towers called ziggurats, which likely inspired the image of the tower.", "significance": "An ancient story about unity and division, it works as a first reflection on globalization and on cities and empire.", "use": "Use it in an essay on connection versus diversity, or on how cities and states claimed power."}, {"id": "s3", "week": 1, "name": "The Melian Dialogue (Thucydides)", "who": "Thucydides, Athenian general and historian; the speakers are Athenian envoys and the rulers of Melos.", "what": "A staged debate in which Athens demands that neutral Melos submit; the Melians appeal to justice, the gods, and Sparta; Athens replies with arguments of power.", "when": "Events of 416 BCE; written around 400 BCE.", "where": "The island of Melos in the Aegean Sea.", "why": "To show how war and empire strip away moral language and reveal the logic of power.", "context": "The Peloponnesian War between Athens (with its Delian League empire) and Sparta.", "significance": "The classic text of political realism; it asks whether might makes right.", "use": "Use it as the source for an essay on empire, justice, or the Soldier as an agent; compare Athenian arguments with later justifications of conquest."}, {"id": "s4", "week": 4, "name": "Enrigue, You Dreamed of Empires (excerpt)", "who": "Álvaro Enrigue, a Mexican novelist.", "what": "A historical novel about the meeting of Cortés and Moctezuma in Tenochtitlan in 1519, told with invented and counterfactual twists.", "when": "Published in Spanish in 2022 as Tu sueño imperios han sido, and in English in 2024 as You Dreamed of Empires (translated by Natasha Wimmer); set in 1519.", "where": "Tenochtitlan, the Mexica capital.", "why": "To reimagine the conquest from a Mexican point of view and question the idea that its outcome was inevitable.", "context": "Spanish arrival in Mexico, the Triple Alliance and its enemies, and the role of translators like Malinche.", "significance": "A modern text, not an eyewitness source, that teaches us to ask counterfactual questions about conquest.", "use": "Use it to show the conquest was contingent; be clear it is fiction, then back it up with historical facts."}, {"id": "s5", "week": 5, "name": "Sepúlveda (Valladolid debate)", "who": "Juan Ginés de Sepúlveda, Spanish humanist scholar and royal chronicler.", "what": "Arguments, especially in his dialogue Democrates Alter, that war against Indigenous Americans was just.", "when": "Written in the 1540s; argued at Valladolid in 1550 to 1551.", "where": "Spain, at the royal court.", "why": "To defend Spanish conquest by using Aristotle's idea that some people are \"natural slaves\" who should be ruled by others.", "context": "Spanish conquest, the encomienda system, and the Crown's worry about abuses.", "significance": "Shows how classical philosophy was used to justify empire and hierarchy.", "use": "Pair with Las Casas to show competing European views; analyze who benefited from his arguments."}, {"id": "s6", "week": 5, "name": "Las Casas (Valladolid debate)", "who": "Bartolomé de las Casas, a former encomendero who became a Dominican friar and bishop.", "what": "Defenses of Indigenous peoples as rational human beings, including his Short Account of the Destruction of the Indies.", "when": "Short Account written 1542 and printed 1552; argued at Valladolid in 1550 to 1551.", "where": "Spain and the Caribbean, Mexico, and Central America, where he had lived.", "why": "To persuade the Spanish Crown to end violent conquest and forced labor and to convert people peacefully.", "context": "The collapse of Indigenous populations in the Caribbean and the encomienda system.", "significance": "An early human rights argument, but he still supported Christian conversion and, for a time, African slavery, which he later regretted.", "use": "Use him as a Sage who tries to limit empire from inside; note the limits of his position."}, {"id": "s7", "week": 6, "name": "Kant, \"What Is Enlightenment?\"", "who": "Immanuel Kant, German philosopher.", "what": "A short essay answering the question of what Enlightenment means: leaving behind self-imposed immaturity by using one's own reason.", "when": "1784.", "where": "Königsberg, Prussia; published in a Berlin monthly journal.", "why": "To encourage people to think for themselves and to argue for freedom of public discussion under King Frederick the Great.", "context": "The European Enlightenment, rising literacy, print culture, and debates about censorship.", "significance": "Defines Enlightenment as a process and an act of courage, summed up in the motto \"sapere aude.\"", "use": "Use it to define Enlightenment in your own words, then ask who was included in the public that could use reason."}, {"id": "s8", "week": 7, "name": "Haitian Declaration of Independence", "who": "Jean-Jacques Dessalines and his generals; drafted by his secretary Louis Boisrond-Tonnerre.", "what": "A proclamation renouncing France forever, naming the new nation Haiti, and calling on its people to defend their freedom.", "when": "January 1, 1804.", "where": "Gonaïves, Haiti (formerly Saint-Domingue).", "why": "To declare total separation from France and to make sure slavery could never return.", "context": "Thirteen years of revolution and Napoleon's failed attempt to restore slavery.", "significance": "Founded the first Black republic and the second independent state in the Americas; the name Haiti came from an Indigenous Taíno word.", "use": "Use it in an essay on the Atlantic Revolutions and on who counted as free; contrast its idea of liberty with others."}]}, "nameThat": {"title": "Name That Source", "blurb": "Read the line or summary. Name the source, then say how you knew.", "cards": [{"id": "n1", "kind": "Quote (King James Version, public domain)", "text": "\"Go to, let us build us a city and a tower, whose top may reach unto heaven.\"", "answer": "Genesis 11 (Tower of Babel)", "clue": "One united people, one city, one tower: the story of unity broken into many languages."}, {"id": "n2", "kind": "Quote (Crawley translation, 1874, public domain)", "text": "\"The strong do what they can and the weak suffer what they must.\"", "answer": "The Melian Dialogue (Thucydides)", "clue": "Athenian envoys explaining why justice only matters between equals in power."}, {"id": "n3", "kind": "Quote (translation used in lecture)", "text": "\"Enlightenment is man's emergence from his self-imposed immaturity.\"", "answer": "Kant, \"What Is Enlightenment?\"", "clue": "Immaturity means being unable to use your own reason without someone else's guidance."}, {"id": "n4", "kind": "Quote (our translation)", "text": "\"Have courage to use your own understanding!\"", "answer": "Kant, \"What Is Enlightenment?\"", "clue": "This is how Kant explains the motto sapere aude."}, {"id": "n5", "kind": "Quote (our translation from the French)", "text": "\"We have dared to be free; let us dare to be free by ourselves and for ourselves.\"", "answer": "Haitian Declaration of Independence", "clue": "A new nation in 1804 breaking from France forever."}, {"id": "n6", "kind": "Summary", "text": "The author describes the peoples of the islands as gentle and peaceful, and the invaders as acting like wolves among sheep.", "answer": "Las Casas, Short Account of the Destruction of the Indies", "clue": "A Dominican friar writing to the Spanish Crown about violence in the Caribbean."}, {"id": "n7", "kind": "Summary", "text": "Following Aristotle, the author argues that people he considers less rational are natural subjects of wiser peoples, so war to rule them is just.", "answer": "Sepúlveda (Valladolid debate)", "clue": "The natural slavery argument used to defend conquest."}, {"id": "n8", "kind": "Summary", "text": "Looking back from the 1990s, the author worries that young people grow up in a permanent present with little link to their society's past.", "answer": "Hobsbawm, The Age of Extremes", "clue": "A historian of the short twentieth century on the destruction of memory."}, {"id": "n9", "kind": "Summary", "text": "A Spanish captain and an emperor meet in a palace in a city built on a lake, and the story keeps reminding us the outcome was not fixed.", "answer": "Enrigue, You Dreamed of Empires", "clue": "A 21st century Mexican novel replaying 1519 with counterfactual twists."}]}, "agents": {"title": "Historical Agents", "blurb": "The five actors with the capacity to cause change. Name examples from different weeks.", "cards": [{"id": "a1", "agent": "Nature", "realm": "The environment", "def": "Climate, geography, rivers, plants, animals, and disease as forces that shape what humans can do.", "examples": ["Tigris and Euphrates floods and irrigation in Mesopotamia", "The Black Death spreading along trade routes in the 1340s", "Smallpox and the Columbian Exchange after 1492", "Sugar, a crop that drove plantation slavery"], "ask": "How did the environment limit or open up choices for people in this example?"}, {"id": "a2", "agent": "The Worker", "realm": "Society", "def": "Farmers, laborers, enslaved people, and others whose work produces wealth and whose resistance can change history.", "examples": ["Labor drafts like the mita in the Andes", "Enslaved Africans on Caribbean sugar plantations", "Indigenous laborers under the encomienda", "The enslaved revolutionaries of Saint-Domingue"], "ask": "Whose labor made this possible, and how did workers shape or resist the system?"}, {"id": "a3", "agent": "The Merchant", "realm": "The economy", "def": "Traders, financiers, and markets that move goods, money, and often ideas across distances.", "examples": ["Silk Roads traders linking Han China and Rome", "Trans-Saharan gold trade and Mali", "Manila galleons carrying silver to China", "The Atlantic sugar and slave trade"], "ask": "What was being traded, who profited, and what else traveled with the goods?"}, {"id": "a4", "agent": "The Soldier", "realm": "Politics", "def": "Warriors, armies, and rulers who use force to build, defend, or destroy states and empires.", "examples": ["Athens at Melos in 416 BCE", "Mongol conquests under Chinggis Khan", "Ottoman cannons at Constantinople in 1453", "Dessalines defeating Napoleon's army"], "ask": "How was force used to gain or keep power, and what did it cost?"}, {"id": "a5", "agent": "The Sage", "realm": "Culture", "def": "Priests, scientists, philosophers, and other scholars who create and spread beliefs and knowledge.", "examples": ["Confucian officials in Han China", "Ibn Battuta as a traveling Muslim scholar", "Las Casas and Sepúlveda at Valladolid", "Kant and Enlightenment thinkers"], "ask": "What ideas did this person or group create or spread, and whose interests did those ideas serve?"}]}, "essays": {"title": "Essay Builder", "blurb": "Practice prompts in the style of the exam. Build a thesis and three body paragraphs, one built around a primary source.", "checklist": ["My thesis answers the question directly and takes a position someone could disagree with.", "I use three specific examples from different world regions.", "At least one primary source is discussed in detail, not just named.", "Each body paragraph starts with a claim that connects to the thesis.", "I contextualize each example (5 W's) and then analyze why it matters.", "I name the historical agents involved where it helps my argument.", "My conclusion explains what the examples show together, beyond repeating the thesis.", "I budget about 10 minutes to outline and 50 to write."], "prompts": [{"id": "e1", "q": "What made a city powerful in the world we have studied so far? Compare three cities from different regions and periods, and use at least one primary source.", "thesis": "Cities became powerful when they could gather people, food, and wealth and turn them into lasting institutions such as law, writing, and a claim to rule the land around them.", "bodies": ["Source paragraph: Genesis 11 and Mesopotamian cities such as Babylon. Irrigation, writing, and law codes like Hammurabi's made them strong, and the Babel story shows ancient writers seeing city power as both great and dangerous.", "Athens: the polis, its citizens, and its navy, and how its power over allies led to Melos.", "Tenochtitlan: a lake city of causeways and markets that fed a huge population and drew tribute from across central Mexico."], "conclusion": "City power rested on organized people and resources, and the strongest cities used it to rule far beyond their walls."}, {"id": "e2", "q": "Was the Mongol Empire more a force of destruction or of connection in Afro-Eurasia? Defend your answer with three specific examples and at least one primary source.", "thesis": "The Mongols were brutally destructive, but their empire's lasting effect was connection, for better and for worse.", "bodies": ["Conquest under Chinggis Khan and the destruction of cities.", "Pax Mongolica: safer trade and travel, envoys and merchants crossing Eurasia.", "Source paragraph: use Genesis 11 to frame the question of a world reunited, then show that connection also spread the Black Death."], "conclusion": "Connection and destruction were linked: the same routes that carried silk carried plague."}, {"id": "e3", "q": "How did the environment and disease shape the encounter between Europeans and Indigenous Americans after 1492? Use three examples from different regions and at least one primary source.", "thesis": "Disease and environment shaped the encounter more than European weapons, but human choices determined how those forces were used.", "bodies": ["Smallpox in Tenochtitlan in 1520 and the Columbian Exchange.", "Population collapse in the Caribbean and the shift to enslaved African labor on sugar plantations.", "Source paragraph: use Las Casas, who blamed Spanish violence, to test how much was Nature and how much was people."], "conclusion": "Nature was a powerful agent, but it never acted alone: conquest and labor systems decided who suffered most."}, {"id": "e4", "q": "In what ways did American silver connect the economies and societies of the Americas, Europe, and East Asia between 1550 and 1700? Use three specific examples and at least one primary source.", "thesis": "American silver created the first global economy, built on forced labor in the Andes and driven by demand in China.", "bodies": ["Potosí and the mita: the human cost of production.", "Manila galleons carrying silver to China and silks and porcelain back.", "Source paragraph: use Las Casas or Sepúlveda to show the debates over Indigenous labor and rights that this economy raised."], "conclusion": "Silver shows globalization as both connection and exploitation: a world linked by a metal mined by coerced workers."}, {"id": "e5", "q": "\"The strong do what they can and the weak suffer what they must.\" Do the examples we have studied support or challenge this claim? Use the Melian Dialogue and two other specific examples from different periods and regions.", "thesis": "Many cases seem to prove the Athenians right, but the weak often found ways to resist, ally, or overturn the strong.", "bodies": ["Source paragraph: the Melian Dialogue and the fate of Melos in 416 BCE.", "Tlaxcala and other enemies of the Triple Alliance allying with the Spanish.", "The Haitian Revolution: enslaved people defeating European armies."], "conclusion": "Power matters, but history is not only written by the strong; alliances and revolt change outcomes."}, {"id": "e6", "q": "Hobsbawm asks historians to identify the crucial events of an era. Make the case that the Haitian Revolution was (or was not) a crucial event in world history. Use three specific examples and at least one primary source.", "thesis": "The Haitian Revolution was a crucial event because it showed that liberty and equality could include enslaved and colonized people.", "bodies": ["Inside Haiti: the end of slavery and French rule, and the founding of the first state created by formerly enslaved people.", "Across the Atlantic: fear among slaveholders in the Caribbean and the United States, and hope for enslaved people and abolitionists. France's loss also helped push Napoleon to sell Louisiana in 1803.", "Source paragraph: the Haitian Declaration of Independence (1804) and what it said about freedom."], "conclusion": "Haiti changed what freedom could mean and who could claim it, shaping debates on slavery across the Atlantic."}]}}};
